[workspace]
name = "ros-distro-template"
description = "Copier template and bot for the RoboStack ROS distribution repositories"
authors = ["Tobias Fischer <tobias.fischer@qut.edu.au>"]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "linux-64", "osx-64", "linux-aarch64", "win-64"]

[dependencies]
python = ">=3.14.0,<3.15"
copier = ">=9.4"
pyyaml = "*"
gh = "*"
git = "*"

[pypi-dependencies]
robostack-bot = { path = ".", editable = true }
# Same vinca as the distributions (template/pixi.toml.jinja); used by update-pinning.
# TEMPORARY: RoboStack/vinca master + a fallback for rosdistro snapshots without
# dependency metadata (Tobias-Fischer/vinca fix/snapshot-deps-fallback), so existing
# snapshots keep working; switch back to RoboStack/vinca once it is merged there.
vinca = { git = "https://github.com/Tobias-Fischer/vinca.git", rev = "df761ca6d82105d6873639d398a2fdba1a757f72" }

[tasks]
render-all = { cmd = "python tools/render_all.py", description = "Render the template for every distribution and diff against the checkouts next to this repo." }
check = { cmd = "python tools/render_all.py --check", description = "Fail if a rendered distribution differs from its repository." }
test = { cmd = "python -m unittest discover -s tests -v", description = "Unit tests for the template and robostack-bot." }
headers = { cmd = "python tools/add_headers.py", description = "Add or refresh the 'generated from ros-distro-template' header of every template-owned file." }
