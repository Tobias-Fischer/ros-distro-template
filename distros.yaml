# Registry of distribution repositories instantiated from this template.
#
# `answers` are only used until a distribution has been adopted; afterwards its
# own .copier-answers.yml is the source of truth (tools/render_all.py prefers it).

rolling:
  repo: RoboStack/ros-rolling
  answers:
    distro: rolling
    package_prefix: ros2-
    channel_name: robostack-rolling
    upload_target: prefix
    # TEMPORARY: RoboStack/vinca@1f1dca5 (before the rosdistro-cache-snapshot
    # feature) + the raw.githubusercontent.com tag-URL fix (RoboStack/vinca#156).
    vinca_git: https://github.com/Tobias-Fischer/vinca.git
    vinca_rev: 9e44663eaf17a1a7ae698e3140ff095a78e849e7

