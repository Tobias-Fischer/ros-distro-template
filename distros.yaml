# Registry of distribution repositories instantiated from this template.
#
# `answers` are only used until a distribution has been adopted; afterwards its
# own .copier-answers.yml is the source of truth (tools/render_all.py prefers it).

rolling:
  repo: RoboStack/ros-rolling
  answers:
    distro: rolling
    upload_target: prefix

humble:
  repo: RoboStack/ros-humble
  answers:
    distro: humble
    channel_name: robostack-staging
    upload_target: anaconda

jazzy:
  repo: RoboStack/ros-jazzy
  answers:
    distro: jazzy
    upload_target: anaconda

kilted:
  repo: RoboStack/ros-kilted
  answers:
    distro: kilted
    upload_target: anaconda

lyrical:
  repo: RoboStack/ros-lyrical
  answers:
    distro: lyrical
    upload_target: prefix
