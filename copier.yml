# Copier template for RoboStack ROS 2 distribution repositories.
#
# Instantiate:  copier copy --trust gh:Tobias-Fischer/ros-distro-template ros-<distro>
# Update:       copier update --trust --defaults   (or let robostack-bot open the PR)
#
# Jinja uses [= var =] / [% if ... %] instead of {{ }} / {% %} so that GitHub
# Actions expressions (${{ ... }}) and pixi task arguments ({{ PACKAGE }}) can be
# written verbatim. Only files ending in .jinja are rendered; everything else is
# copied as-is.

_min_copier_version: "9.4"
_subdirectory: template
_templates_suffix: .jinja
_envops:
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "[="
  variable_end_string: "=]"
  comment_start_string: "[#"
  comment_end_string: "#]"
  keep_trailing_newline: true
  trim_blocks: true
  lstrip_blocks: true

# Seeded once when a distribution is created, then owned by the distribution.
# Everything else in template/ is owned by the template: do not edit those files
# in a distribution repository, change the template instead.
_skip_if_exists:
  - ci.yaml
  - vinca.yaml
  - pkg_additional_info.yaml
  - rosdistro_additional_recipes.yaml

distro:
  type: str
  help: ROS distribution name (as used by rosdistro), e.g. jazzy
  validator: "[% if not distro.isidentifier() or distro != distro.lower() %]lowercase name required[% endif %]"

channel_name:
  type: str
  help: Channel the distribution is published to
  default: "robostack-[= distro =]"

upload_target:
  type: str
  help: Where packages are uploaded
  choices:
    prefix.dev: prefix
    anaconda.org: anaconda
  default: prefix

conda_forge_pinning_version:
  type: str
  help: >-
    Stay on this conda-forge-pinning version (e.g. 2026.09.01.16.28.00) instead of
    the shared one in pinning/conda_forge.yaml; empty to follow the shared pinning
  default: ""

conda_forge_migrations:
  type: yaml
  help: Migrations to apply with conda_forge_pinning_version (ignored when it is empty)
  default: []
  when: "[= conda_forge_pinning_version != '' =]"

pinning_overrides:
  type: yaml
  help: >-
    Distribution-specific pinning overrides, e.g. {python: ["3.12.* *_cpython"]};
    they replace the shared entries of the same name in pinning/overrides.yaml
  default: {}

# Computed values (not asked, not stored in the answers file).
channel_url:
  type: str
  when: false
  default: "[% if upload_target == 'prefix' %]https://prefix.dev/[= channel_name =][% else %]https://conda.anaconda.org/[= channel_name =][% endif %]"

example_package:
  type: str
  when: false
  default: "ros2-ros-workspace"

# Where this template (and robostack-bot) lives. Under review in Tobias-Fischer's
# account for now; change to RoboStack/ros-distro-template when it moves.
template_repo:
  type: str
  when: false
  default: Tobias-Fischer/ros-distro-template

template_url:
  type: str
  when: false
  default: "https://github.com/[= template_repo =]"
