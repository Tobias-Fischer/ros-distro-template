# Instantiate a new ROS distribution repository from the template, seeded with
# the package selection of an existing distribution (robostack-bot new-distro).
name: New distribution

on:
  workflow_dispatch:
    inputs:
      name:
        description: ROS distribution name (rosdistro), e.g. macaroni
        required: true
      source:
        description: Existing distribution to seed vinca.yaml & co. from
        default: rolling
      upload_target:
        description: Upload target
        type: choice
        options: [prefix, anaconda]
        default: prefix
      create_repo:
        description: Create RoboStack/ros-<name> and push (otherwise only upload an artifact)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  new-distro:
    runs-on: ubuntu-latest
    steps:
      - name: Bot token
        id: app
        if: inputs.create_repo
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ROBOSTACK_BOT_APP_ID }}
          private-key: ${{ secrets.ROBOSTACK_BOT_PRIVATE_KEY }}
          owner: RoboStack
      - uses: actions/checkout@v6
        with:
          path: ros-distro-template
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: RoboStack/ros-${{ inputs.source }}
          path: source
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.75.0
          manifest-path: ros-distro-template/pixi.toml
      - name: Instantiate
        env:
          NAME: ${{ inputs.name }}
          UPLOAD: ${{ inputs.upload_target }}
        run: |
          pixi run --manifest-path ros-distro-template/pixi.toml robostack-bot \
            --summary "$RUNNER_TEMP/checklist.md" \
            new-distro "$NAME" --from source --dest "ros-$NAME" \
            --template "$GITHUB_WORKSPACE/ros-distro-template" --set "upload_target=$UPLOAD"
          cd "ros-$NAME"
          pixi run create_snapshot
          pixi run vinca-pinning-render
          git init -q -b main
          git add -A && git add -f .scripts
          git -c user.name=robostack-bot -c user.email=robostack-bot@users.noreply.github.com \
            commit -qm "Instantiate ros-$NAME from ros-distro-template (seeded from ros-${{ inputs.source }})"
      - uses: actions/upload-artifact@v6
        with:
          name: ros-${{ inputs.name }}
          path: ros-${{ inputs.name }}
          include-hidden-files: true
      - name: Create the repository
        if: inputs.create_repo
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NAME: ${{ inputs.name }}
        run: |
          gh repo create "RoboStack/ros-$NAME" --public --description "RoboStack packages for ROS $NAME"
          git -C "ros-$NAME" push "https://x-access-token:${GH_TOKEN}@github.com/RoboStack/ros-$NAME.git" main
          gh issue create --repo "RoboStack/ros-$NAME" --title "Bootstrap checklist" --body-file "$RUNNER_TEMP/checklist.md"
