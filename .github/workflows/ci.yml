# Template CI: unit tests, plus a render of every distribution compared with its
# repository's main branch, so a template PR shows exactly what each
# distribution will receive.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.75.0
      - run: pixi run test

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: ros-distro-template
          fetch-depth: 0
      - name: Check out the distributions
        run: |
          # yq is preinstalled on the GitHub-hosted Ubuntu runners.
          for distro in $(yq 'keys | .[]' ros-distro-template/distros.yaml); do
            git clone --quiet --depth 1 "https://github.com/RoboStack/ros-$distro.git" "ros-$distro"
          done
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.75.0
          manifest-path: ros-distro-template/pixi.toml
      - name: Render and compare
        working-directory: ros-distro-template
        run: |
          # Commit the PR state so copier (which renders a git ref) sees it.
          git -c user.name=ci -c user.email=ci@localhost commit --allow-empty -qm "render" || true
          pixi run python tools/render_all.py --diff | tee "$RUNNER_TEMP/render.txt"
          { echo '```'; cat "$RUNNER_TEMP/render.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
